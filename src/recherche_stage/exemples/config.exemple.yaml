# Configuration du système. Les secrets ne s'écrivent jamais ici : seulement le
# NOM des variables d'environnement qui les contiennent.
# Clé API Claude : variable ANTHROPIC_API_KEY (ou `ant auth login`).

donnees: donnees            # base SQLite et fichiers générés (local, RGPD)
conservation_mois: 12       # rs rgpd purger supprime les dossiers terminés plus anciens

orchestrateur:
  candidatures_max_par_semaine: 15
  seuil_score_minimum: 60
  iterations_critique_max: 2
  dossiers_max_par_cycle: 5 # enquêtes et rédactions par cycle : étale la consommation
  appels_api_max_par_semaine: 600
  seuil_confiance: 0.5

autonomie:                  # levée de la validation humaine avant envoi
  fenetre: 30
  taux_requis: 0.95

llm:
  fournisseur: claude       # claude (clé d'API), claude_code (abonnement Claude, sans clé) ou gemini
  # fournisseur_critique: gemini   # Critique sur l'autre fournisseur : relecture vraiment indépendante
  modele: claude-opus-5-5
  modele_critique: claude-opus-5-5
  effort: medium
  effort_critique: high
  claude_code_modele: claude-sonnet-5-5   # identifiant exact (ou alias sonnet, opus, haiku)
  claude_code_modele_critique: claude-sonnet-5-5
  # claude_code_modele_par_agent: {scoring: claude-haiku-4-5}   # agent moins coûteux
  claude_code_effort: low                 # low, medium, high… : chaque palier consomme plus
  claude_code_effort_critique: medium
  recherche_web: true       # enquête entreprise par recherche web sourcée
  gemini_modele: gemini-3.8-flash         # clé : variable GEMINI_API_KEY (aistudio.google.com)
  gemini_modele_critique: gemini-3.8-flash
  gemini_modele_secours: [gemini-3.7-flash, gemini-3.5-flash, gemini-2.5-flash]  # essayés dans l'ordre si saturé (503/429)
  gemini_reflexion: low              # minimal, low, medium, high (défaut Google : high, plus lent)
  gemini_reflexion_critique: medium
  temperature_critique: 0.1               # appliquée par Gemini uniquement

critique:
  seuil_validation: 80
  seuil_renvoi: 60
  fautes_max: 2
  # languagetool_url: http://localhost:8081   # correcteur local (optionnel)

sources:
  # --- Sites carrière (API publiques des ATS) ---------------------------------
  # Le plus simple : coller l'adresse de la page carrière (lien « voir toutes
  # les offres »). Si l'ATS n'est pas reconnu : rs detecter-ats <url>
  ats: []
  #  - {nom: "Exemple SA", url: "https://jobs.lever.co/exemple"}
  #  - {nom: "Autre SAS", ats: greenhouse, identifiant: autre}
  # ATS pris en charge : greenhouse, lever, lever_eu, smartrecruiters,
  # workable, ashby, recruitee, personio.
  flux: []                  # flux RSS/Atom d'un site carrière ou d'offres
  #  - {nom: "Exemple SA", url: "https://exemple.fr/carrieres/rss"}
  #  - {nom: "Site d'offres", url: "https://…/rss", entreprise_fixe: false}

  # --- Indeed, JobTeaser, Welcome to the Jungle, HelloWork, APEC --------------
  # 1. Sur chaque site, créer une alerte mail « stage » avec tes critères.
  # 2. Renseigner suivi.imap (plus bas), puis activer :
  alertes_mail: false
  alertes_plateformes: [indeed, jobteaser, wttj, hellowork, apec]
  alertes_dossier: ""       # libellé Gmail des alertes si tu les y ranges, ex. "Alertes"
  alertes_jours: 7
  # Export manuel toujours possible : CSV/JSON déposé dans imports/
  import_fichier: true
  dossier_imports: imports

  # --- Agrégateur Adzuna (clés gratuites sur developer.adzuna.com) ------------
  adzuna: false
  adzuna_app_id_env: ADZUNA_APP_ID
  adzuna_app_key_env: ADZUNA_APP_KEY

  # --- Officiel ----------------------------------------------------------------
  france_travail: false     # API officielle, compte francetravail.io requis
  france_travail_client_id_env: FT_CLIENT_ID
  france_travail_secret_env: FT_CLIENT_SECRET
  annuaire: false           # candidatures spontanées via recherche-entreprises.api.gouv.fr
  annuaire_codes_naf: []    # ex. ["33.12Z", "35.11Z"]
  annuaire_departements: [] # ex. ["59", "62"]
  annuaire_effectif_min: 10 # écarte les très petites structures (0 : aucune limite)
  annuaire_max: 20          # nouvelles entreprises par cycle ; chaque cycle reprend où le précédent s'est arrêté

envoi:
  smtp:                     # laisser hote vide : aucun envoi, brouillons seulement
    hote: ""                # ex. smtp.gmail.com
    port: 465
    utilisateur: ""
    mot_de_passe_env: SMTP_MOT_DE_PASSE   # Gmail : mot de passe d'application
    expediteur: ""
  fenetre: {jours: [0, 1, 2, 3], heure_debut: 8, heure_fin: 11}

suivi:
  imap:
    hote: ""                # ex. imap.gmail.com
    port: 993
    utilisateur: ""
    mot_de_passe_env: IMAP_MOT_DE_PASSE
    dossier: INBOX
  relances_jours: [7, 14]
  # Ton tableau Excel de suivi, tenu à jour après chaque cycle et chaque validation
  # (colonnes reconnues à leur intitulé ; tes notes et colonnes inconnues restent intactes).
  # excel: C:\Users\moi\Documents\Suivi_candidatures.xlsx
  # excel_feuille: Candidatures      # par défaut : la première feuille
